<!DOCTYPE html>
<html>
<head>
    <title>Test AI Generation Fix</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; }
        .btn { background: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; margin: 10px 0; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; background: #f8fafc; border: 1px solid #e2e8f0; }
        input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #dc2626; }
        .info { background: #dbeafe; color: #1d4ed8; }
        pre { background: #f1f5f9; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; }
        .email-preview { background: white; border: 2px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-top: 15px; }
        .subject-line { font-weight: bold; color: #1f2937; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #e5e7eb; }
    </style>
</head>
<body>
    <h1>🔧 AI Generation Fix Test</h1>
    <p>Testing the improved AI generation parsing</p>
    
    <div>
        <label>NVIDIA API Key:</label>
        <input type="password" id="apiKey" placeholder="nvapi-..." />
        
        <label>Name:</label>
        <input type="text" id="name" value="John Smith" />
        
        <label>Company:</label>
        <input type="text" id="company" value="TechCorp Solutions" />
        
        <button class="btn" onclick="testAI()">🚀 Test Fixed AI Generation</button>
        <button class="btn" onclick="testWithBadResponse()" style="background: #dc2626;">Simulate Bad Response</button>
    </div>
    
    <div id="result"></div>
    
    <script>
        async function testAI() {
            const resultDiv = document.getElementById('result');
            const apiKey = document.getElementById('apiKey').value.trim();
            const name = document.getElementById('name').value.trim();
            const company = document.getElementById('company').value.trim();
            
            if (!apiKey || !name || !company) {
                resultDiv.innerHTML = '<div class="error status">❌ Please fill all fields</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="info status">⏳ Testing AI generation with improved parsing...</div>';
            
            try {
                const response = await fetch('/api/ops?type=generate-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        company: company,
                        role: 'CTO',
                        category: 'Technology',
                        apiKey: apiKey
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success status">✅ AI Generation ${data.fallback ? 'Fallback' : 'Success'}!</div>
                        
                        <div class="email-preview">
                            <div class="subject-line">
                                <strong>Subject:</strong> ${escapeHtml(data.subject)}
                            </div>
                            <div style="line-height: 1.6;">
                                ${escapeHtml(data.body).replace(/\\n/g, '<br>')}
                            </div>
                        </div>
                        
                        <details style="margin-top: 15px;">
                            <summary>Raw Response Data</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error status">❌ Error: ${data.error}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error status">❌ Network Error: ${error.message}</div>
                `;
            }
        }
        
        async function testWithBadResponse() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="info status">🧪 Simulating malformed AI response...</div>
                <p>This would test how the system handles responses like:</p>
                <pre>Sub: Quick idea for [Company]\`\`\`json {   "   "body": "Hi [Name]..."</pre>
                <p>The improved parsing should handle this gracefully.</p>
            `;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
